[package]
name = "know_prolog"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
jieba-rs = "0.7"
aes-gcm = "0.10"
rand = "0.8"
toml = "0.8"
oxigraph = { version = "0.4", features = ["http-client"] }
scryer-prolog = "0.9"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
json-ld = "0.16"
clap = { version = "4.0", features = ["derive"] }
regex = "1.0"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.3.0"

[profile.release]
lto = "thin"
codegen-units = 1