services:
  know-prolog:
    build: .
    image: knowprolog:local
    command:
      - serve
      - --addr
      - 0.0.0.0:8080
      - --session-dir
      - /app/oxigraph_data/sessions
      - --recovery
      - "on"
    ports:
      - "${KNOWPROLOG_PORT:-8080}:8080"
    volumes:
      - knowprolog-data:/app/oxigraph_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  knowprolog-data:
