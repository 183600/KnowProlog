# 泛化前缀模式：精确命中后仍让软路由复核，避免挡住更具体的规则；
# 软层拒绝/澄清时仍保留本命中。
defer_to_soft = true
# 基础实体类型配置
[[entity_types]]
label = "Person"
examples = ["人物信息"]

[[entity_types.properties]]
name = "name"
data_type = "string"
required = true

[[entity_types.properties]]
name = "age"
data_type = "integer"
required = false

[[entity_types.properties]]
name = "height"
data_type = "integer"
required = false

[[entity_types.properties]]
name = "weight"
data_type = "integer"
required = false

# 通用实体类型
[[entity_types]]
label = "Entity"
examples = ["通用实体"]

[[entity_types.properties]]
name = "name"
data_type = "string"
required = true

[[entity_types.properties]]
name = "property"
data_type = "string"
required = false
# 基础提取规则
[[extraction_rules]]
name = "人物信息提取"
entity_type = "Person"
priority = 10

[[extraction_rules.patterns]]
pos_pattern = ["nr", "m", "q"]
property_mappings = { name = "pos:nr", age = "pos:m" }

[[extraction_rules.patterns]]
pos_pattern = ["nr", "v", "m", "q"]
property_mappings = { name = "pos:nr", age = "pos:m" }

[[extraction_rules.patterns]]
pos_pattern = ["nr", "unknown", "m", "q"]
property_mappings = { name = "pos:nr", age = "pos:m" }

# 身体数据提取：X身高226 / X体重120
[[extraction_rules]]
name = "身体数据提取"
entity_type = "Person"
priority = 9

[[extraction_rules.patterns]]
pos_pattern = ["nr", "unknown", "m", "q"]
keyword_patterns = ["身高"]
property_mappings = { name = "pos:nr", height = "pos:m" }

[[extraction_rules.patterns]]
pos_pattern = ["nr", "unknown", "m"]
keyword_patterns = ["身高"]
property_mappings = { name = "pos:nr", height = "pos:m" }

[[extraction_rules.patterns]]
pos_pattern = ["nr", "unknown", "m", "q"]
keyword_patterns = ["体重"]
property_mappings = { name = "pos:nr", weight = "pos:m" }

[[extraction_rules.patterns]]
pos_pattern = ["nr", "unknown", "m"]
keyword_patterns = ["体重"]
property_mappings = { name = "pos:nr", weight = "pos:m" }

# 通用实体提取规则
[[extraction_rules]]
name = "通用实体提取"
entity_type = "Entity"
priority = 1

[[extraction_rules.patterns]]
pos_pattern = ["nr", "v", "*"]
property_mappings = { name = "pos:nr", property = "pos:*" }

[[extraction_rules.patterns]]
pos_pattern = ["n", "v", "*"]
property_mappings = { name = "pos:n", property = "pos:*" }

