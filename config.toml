# 基础实体类型配置（仅保留系统正常运行必需的基础类型）
[[entity_types]]
label = "Person"
examples = ["人物信息"]

[[entity_types.properties]]
name = "name"
data_type = "string"
required = true
extraction_patterns = ["pos:nr"]

[[entity_types.properties]]
name = "age"
data_type = "integer"
required = false
extraction_patterns = ["pos:m"]

# 通用实体类型
[[entity_types]]
label = "Entity"
examples = ["通用实体"]

[[entity_types.properties]]
name = "name"
data_type = "string"
required = true
extraction_patterns = ["pos:nr", "pos:n"]

[[entity_types.properties]]
name = "property"
data_type = "string"
required = false
extraction_patterns = ["pos:n", "pos:a", "pos:m"]# 基础提取规则（仅保留基本的规则模板）
[[extraction_rules]]
name = "人物信息提取"
entity_type = "Person"
priority = 10

[[extraction_rules.patterns]]
pos_pattern = ["nr", "m", "q"]
property_mappings = { name = "pos:nr", age = "pos:m" }

[[extraction_rules.patterns]]
pos_pattern = ["nr", "v", "m", "q"]
property_mappings = { name = "pos:nr", age = "pos:m" }

# 通用实体提取规则
[[extraction_rules]]
name = "通用实体提取"
entity_type = "Entity"
priority = 1

[[extraction_rules.patterns]]
pos_pattern = ["nr", "v", "*"]
property_mappings = { name = "pos:nr", property = "pos:*" }

[[extraction_rules.patterns]]
pos_pattern = ["n", "v", "*"]
property_mappings = { name = "pos:n", property = "pos:*" }

[messages]
startup = "知识图谱系统启动中..."
ready = "系统已就绪！"
query_prompt = "请输入您的查询"
import_prompt = "输入'导入：'开始导入知识"
quit_prompt = "输入'quit'退出系统"
importing = "正在导入知识..."
