[system]
oxigraph_endpoint = "http://localhost:7878"  # Oxigraph HTTP端点
oxigraph_store_path = "oxigraph_data"       # Oxigraph数据存储路径
default_language = "zh"

# Ownthink API配置
[api]
ownthink_base_url = "https://api.ownthink.com/kg"
ownthink_timeout_seconds = 10
enable_entity_disambiguation = true  # 是否启用实体歧义解析
max_ambiguous_entities = 5          # 显示的最大歧义实体数量
auto_select_best_entity = true       # 是否自动选择权重最高的实体

# 外链名册：外部知识的持久缓存（出处 + 逻辑时刻 + 时限）
external_ledger_path = ""            # 落盘路径；留空使用 <存储目录>/external_ledger.json
external_ledger_capacity = 64        # 条目数上限（LRU 淘汰）
external_ledger_ttl_ticks = 0        # 时限（逻辑轮次，0 = 不过期，刷新用「外链刷新：实体」）

# 符号推理配置（本体对齐 + 链接预测）
[reasoning]
enable_link_prediction = true          # 是否启用链接预测推理
link_prediction_min_confidence = 0.6   # 规则置信度阈值
link_prediction_min_support = 2        # 规则最小支持度
ontology_alignment_threshold = 0.72    # 术语字面相似度对齐阈值
max_predictions = 5                    # 单次回答最多展示的预测数量
enable_semantic_embedding = true       # 是否启用符号化知识嵌入（PPMI 角色向量，无神经网络）
embedding_similarity_floor = 0.6       # 近邻检索的最低余弦相似度
dialogue_state_path = "oxigraph_data/dialogue_state.json"  # 对话记忆持久化文件（跨会话）
enable_generation = true               # 是否启用符号化生成（实体链接 + 介绍生成 + 统计续写）
enable_contextual_rag = false          # 对话级证据装配（焦点帧 × 全息召回 × 证据束；默认关闭）
max_profile_sentences = 6              # 单次生成介绍段落的最大事实句数
completion_min_score = 0.3             # 类型级/全局级谓词回退的最低统计支持度
enable_entailment = true               # 是否启用形式化语义与语义蕴含判定（陈述句校验/生成自检）
entailment_min_confidence = 0.5        # 规则推断作为蕴含证据的最低置信度
enable_resolution = true               # 是否启用一阶归结推理（证明树 + 推理链，纯符号）
resolution_max_depth = 6               # 归结搜索的最大嵌套深度（防无限递归）
resolution_max_solutions = 12          # 归结查询最多返回的解数
enable_association_rules = true        # 是否启用关联规则挖掘（支持度/置信度/提升度/杠杆率）
association_min_support = 0.2          # 关联规则最小支持度（实体篮子占比）
association_min_confidence = 0.5       # 关联规则最小置信度
association_min_lift = 1.05            # 关联规则最小提升度（>1 才说明非随机共现）
enable_abduction = true               # 是否启用溯因推理·假设生成（后向链失败前沿 + 候选假设排序，纯符号）
abduction_max_hypotheses = 5          # 单次溯因最多生成的候选假设数
abduction_max_scenario_size = 2       # 联合解释场景最多包含的假设条数（多假设协同证明目标）
enable_clarification = true           # 是否启用对话式澄清（系统把待定假设逆转为「是/不是」提问并记忆回答）
enable_graph_walk = true              # 是否启用符号化图嵌入（随机游走重启 RWR，结构联想/话题延伸，无神经网络）
graph_walk_damping = 0.85             # RWR 阻尼系数（每步继续游走的概率）
graph_walk_iterations = 12            # RWR 幂迭代轮数
enable_soft_logic = true              # 是否启用加权软逻辑（MLN-lite：log-odds 累加 + sigmoid，输出概率化推测）
soft_logic_max_iterations = 4         # 软真值传播的最大不动点迭代轮数
soft_logic_min_probability = 0.5      # 软推理候选的最低概率阈值
enable_causal_reasoning = true        # 是否启用因果推理（因果图 + do-演算干预 + 反事实比较，纯符号）
causal_max_depth = 4                  # 因果链最大枚举长度（1-8，防组合爆炸）
enable_gradient_attribution = true    # 是否启用符号梯度归因（∂P/∂w 解析求导，仅解释不训练）
enable_causal_tokenization = true     # 是否启用因果分词（知识/因果图引导 token 格 DP + token 级因果归因，纯符号）
enable_problog = true                  # 是否启用 ProbLog 风格概率逻辑（概率事实/规则/注释析取 + BDD 可能世界精确推理）
problog_max_depth = 6                  # 概率规则基化展开与证明路径搜索的最大深度
problog_max_proofs = 12                # 单次概率查询最多枚举的证明路径数
enable_dialogue_manager = true         # 是否启用本体化对话管理器（对话本体 + Horn 规则策略 + 组合生成，无神经网络）
enable_discourse = true                # 是否启用符号主义话语引擎（OWL 本体叙述 + Prolog DCG 文法实现，无神经网络）
discourse_max_sentences = 6            # 单次叙述最多包含的句子数（定义开场/继承/聚合/衔接共享上限）
discourse_max_rounds = 4               # 本体闭包物化的最大推理轮数（子类/属性继承沿层级传播）
enable_holographic_memory = true       # 是否启用全息符号记忆（VSA/HDC：绑定/叠加/置换 + 净噪的软召回 + 三元组硬核查，零训练）
holographic_dimension = 4096           # 全息超向量维度（越大串扰越小，建议 2048~8192）
holographic_similarity_floor = 0.01    # 召回候选的余弦下限（低于视为串扰噪声）
holographic_max_hits = 6               # 单次全息召回的最大候选数
require_predicate_admission = false    # 严格准入：只允许画像中已登记的谓词入库（false=未知谓词自动待确认准入）

# 建设性多跳：链式查询缺一条中间边时，用已挖掘规则合成查询局部虚拟事实，
# 让推断继续参与下一跳；默认关闭，关闭时回答路径逐字节不变。
[reasoning.constructive]
enabled = false                       # 是否在链式查询缺口处启用建设性合成
max_depth = 4                         # 虚拟事实最大推导深度
max_virtual_facts = 96                # 查询/会话作用域虚拟事实总上限
max_candidates_per_round = 32         # 单轮最多保留的候选事实数
max_expansions = 8000                 # 单次饱和的最大规则展开次数
beam_width = 32                       # 单轮最多插入的虚拟事实数
min_confidence_bps = 3500             # 候选进入下一跳的最低置信度（万分之一）
session_capacity = 64                 # 会话作用域确认事实容量（LRU）
promotion_threshold_bps = 8000        # 允许晋升为会话事实的最低置信度

# 可携带证明的置信度层（PCC）：原始证据 → PAV 校准断点 → log-odds 融合
# → 四档决策（回答/含糊/澄清/拒答）→ 双词表回执。
# 关闭 enabled 即逐字节回到旧回答路径；启用时 config-lint 会重算风险证书。
[reasoning.confidence]
enabled = true
prior = 0.5                            # 融合前的基准正确率（log-odds 原点）
answer_threshold = 0.86                # 校准后 ≥ 此值才允许正常回答
hedge_threshold = 0.62                 # [hedge, answer) 之间只给含糊回答
clarify_threshold = 0.55               # 理解置信度低于此值先澄清，不硬答
near_margin = 0.06                     # P 与判定阈值相距多近算边界样本
approximate_evidence = 0.55            # BDD 超限近似时证据源的原始分
# 风险证书：n 个已标注「被回答」样本中 errors 个错误；
# Clopper-Pearson 单侧上界必须 ≤ max_error_rate，claimed_upper_bound 必须能复算。
# 当前为保守基线计数；换标注集或改阈值时必须同步更新 n/errors/上界。
certificate = { n = 240, errors = 4, alpha = 0.05, delta = 0.001, max_error_rate = 0.05, claimed_upper_bound = 0.0377 }

[[reasoning.confidence.sources]]
name = "intent"                        # PQI 意图后验：我有多懂你在问什么
gamma = 0.50                           # 与证据源相关，折扣后计票
calibration = [
  { score = 0.00, probability = 0.05 },
  { score = 0.50, probability = 0.55 },
  { score = 0.70, probability = 0.72 },
  { score = 0.85, probability = 0.85 },
  { score = 0.95, probability = 0.94 },
  { score = 1.00, probability = 0.99 },
]

[[reasoning.confidence.sources]]
name = "evidence"                      # 推理证据：精确 BDD 计数 vs 超限近似
gamma = 0.40
calibration = [
  { score = 0.00, probability = 0.05 },
  { score = 0.55, probability = 0.62 },
  { score = 0.70, probability = 0.78 },
  { score = 1.00, probability = 0.98 },
]

[[reasoning.confidence.sources]]
name = "margin"                        # 与判定阈值的距离：贴边时降级
gamma = 0.30
calibration = [
  { score = 0.00, probability = 0.02 },
  { score = 0.25, probability = 0.40 },
  { score = 0.50, probability = 0.65 },
  { score = 1.00, probability = 0.95 },
]

# 软路由：精确模式路由失败后，用动态规划软对齐 + log-odds 证据竞争解释。
# 只在精确/回退路由都未命中时接管；守卫与覆盖闸门先行，领先不足时澄清或回退。
[reasoning.soft_route]
enabled = true                         # 关闭后与旧路径逐字节一致
accept_threshold = 0.74                # 接受解释的最低后验
clarify_threshold = 0.48               # 进入澄清档的最低后验
accept_margin = 0.08                   # 不同路由的领先优势下限
min_alignment = 0.62                   # 对齐得分硬闸门
min_token_coverage = 0.65              # token 覆盖硬闸门
alignment_pivot = 0.72                 # 对齐证据的中性点
alignment_scale = 0.12                 # 对齐证据尺度
alignment_gain = 1.6                   # 对齐证据的 log-odds 增益
priority_gain = 0.35                   # 模式优先级先验增益
specificity_gain = 0.25                # 模式特化度先验增益
context_bonus = 0.30                   # 守卫满足时的上下文证据
fallback_penalty = 0.30                # NLU 回退候选折扣
extra_token_penalty = 0.06             # 每个未对齐实词的惩罚
fuzzy_floor = 0.55                     # 单要素可接受的最低对齐质量
max_alternatives = 4                   # 报告展示的候选上限

# 声明式插件（符号专家）：每个包是一份带类型贡献的 TOML 清单，
# 不加载动态库、不执行插件代码；交互模式用「插件」查看，用「启用插件：<id>」切换。
[plugins]
directory = "plugins"                 # 清单目录：dir/*.toml 或 dir/<package>/manifest.toml
enabled = []                          # 启动时默认启用的插件 id（可留空）
modes = {}                            # 逐包模式覆盖，例如 [plugins.modes] "zh.film" = "on"

# 谓词画像：声明别名/互逆/功能/传递/对称，导入时统一归一方向，查询时自动换算。
[[predicate_profiles]]
name = "师傅"                          # 规范谓词名
aliases = ["老师", "恩师", "师父"]     # 别名导入/查询均归一为规范名
inverse = "徒弟"                       # 互逆谓词：徒弟(b,a) ≡ 师傅(a,b)，导入自动翻转
transitive = true                      # 传递：师傅(a,b) ∧ 师傅(b,c) ⇒ 师傅(a,c)（师祖链）
domain = ["人物"]                      # 定义域：主语类型不符（且类型已知）时不落库
range = ["人物"]                       # 值域：宾语类型不符（且类型已知）时不落库

[[predicate_profiles]]
name = "徒弟"
aliases = ["学生"]
inverse = "师傅"
transitive = true

[[predicate_profiles]]
name = "年龄"
aliases = ["岁数"]
functional = true                      # 功能谓词：同主语多值将标记冲突而非静默覆盖

[[predicate_profiles]]
name = "配偶"
aliases = ["妻子", "丈夫", "老婆", "老公"]
symmetric = true                       # 对称：配偶(a,b) ⇒ 配偶(b,a)

[[predicate_profiles]]
name = "居住于"
aliases = ["住在", "居住地"]
functional = true

[[predicate_profiles]]
name = "出生于"
aliases = ["籍贯", "出生地"]
functional = true

[[predicate_profiles]]
name = "任职于"
aliases = ["工作单位", "所在单位"]

# 类型体系：实体类型的别名/子类/互斥声明（谓词画像的定义域/值域以规范类型书写）。
# closure_gate = true 时模式闸门按「别名归一 + 子类闭包 + 互斥证据」判定：
# 仅当两类型存在显式互斥声明时才拒收；无证据（含未声明类型）一律按开放世界放行。
[type_system]
closure_gate = true

[[type_system.aliases]]
alias = "Person"                       # 实体标签别名（大小写不敏感，导入/查询均归一）
canonical = "人物"

[[type_system.aliases]]
alias = "Entity"
canonical = "实体"

[[type_system.aliases]]
alias = "人"
canonical = "人物"

[[type_system.subclasses]]
sub = "人物"
sup = "实体"

[[type_system.subclasses]]
sub = "地点"
sup = "实体"

[[type_system.subclasses]]
sub = "学生"                           # 学生 ⊑ 人物：自动满足要求「人物」的定义域
sup = "人物"

[[type_system.disjoint]]
left = "人物"                          # 可证明不兼容的唯一来源（互斥兜底）
right = "地点"

# 分层追踪图（可选）：把每轮决策写入显式工作记忆，供「追踪报告」查看。
# mode 三档与失败恢复同构：off 不记录（默认，行为完全兼容）/ observe 只记不介入 /
# on 让追踪参与理解与生成（谓词焦点继承、用户更正覆盖旧值、失效传播）。
# 可用命令行 `--trace off|observe|on` 覆盖本节设置。
[trace_graph]
mode = "off"                           # off | observe | on
max_turns = 24                         # 会话内保留的轮迹上限
max_nodes_per_turn = 64                # 单轮决策节点上限（超出折叠为摘要）
max_events_per_turn = 16               # 单轮指代事件上限

# 配置编译的绑定帧（可选）：把「模式 -> 槽位 -> 目标 -> 措辞」声明在配置里，
# 启动时编译成只读程序；运行期只做通用绑定，不硬编码具体属性词。
# 任一帧不匹配时零状态变化，自动回退常规管线。
[dialogue_frames]
enabled = true

# 人物属性：完整问句、省略实体的追问、从上一轮继承实体。
[[dialogue_frames.frames]]
id = "person.attribute"
priority = 20
patterns = ["{entity}的{attribute}是什么", "{entity}的{attribute}是多少", "{attribute}呢", "{attribute}是多少"]
realize = { answer = "{entity}的{attribute}是{values}。" }

[[dialogue_frames.frames.slots]]
name = "entity"
sort = "entity"
required = true
inherit = true
candidates = "entities"
ask = "请问你说的是谁？"

[[dialogue_frames.frames.slots]]
name = "attribute"
sort = "attribute"
required = true
inherit = true
candidates = "attributes"

[[dialogue_frames.frames.slots]]
name = "value"
sort = "text"

[dialogue_frames.frames.goal]
kind = "attribute"
entity = "entity"
attribute = "attribute"
output = "value"

# 数值比较：显式绑定左右实体与属性，输出胜者与两侧取值。
[[dialogue_frames.frames]]
id = "person.compare"
priority = 30
patterns = ["{left}和{right}的{attribute}谁更高"]
realize = { answer = "{left}的{attribute}是{left_value}，{right}的{attribute}是{right_value}；{comparison}。" }

[[dialogue_frames.frames.slots]]
name = "left"
sort = "entity"
required = true
candidates = "entities"

[[dialogue_frames.frames.slots]]
name = "right"
sort = "entity"
required = true
candidates = "entities"

[[dialogue_frames.frames.slots]]
name = "attribute"
sort = "attribute"
required = true
inherit = true
candidates = "attributes"

[[dialogue_frames.frames.slots]]
name = "winner"
sort = "text"

[dialogue_frames.frames.goal]
kind = "compare"
left = "left"
right = "right"
attribute = "attribute"
output = "winner"

# 首都查询：常量属性 + 单槽绑定，演示 const: 目标写法。
[[dialogue_frames.frames]]
id = "geo.capital"
priority = 10
patterns = ["{entity}的首都是哪里", "{entity}的首都在哪"]
realize = { answer = "{entity}的首都是{value}。" }

[[dialogue_frames.frames.slots]]
name = "entity"
sort = "entity"
required = true
candidates = "entities"
ask = "你想问哪个地方的首都？"

[[dialogue_frames.frames.slots]]
name = "value"
sort = "text"

[dialogue_frames.frames.goal]
kind = "attribute"
entity = "entity"
attribute = "const:capital"
output = "value"

[nlp]
import_keywords = ["录入", "添加", "新增", "记录", "导入", "导入jsonld文件", "导入jsonld内容", "import jsonld", "import jsonld content"]
enable_nlu = true  # 启用语义理解功能
nlu_confidence_threshold = 0.6  # NLU置信度阈值
enable_local_semantic = true  # 启用本地语义理解
disable_ownthink_api = true   # 禁用 ownthink API
semantic_similarity_threshold = 0.7  # 语义相似度阈值
max_entity_candidates = 10  # 最大实体候选数量
enable_advanced_entity_extraction = true  # 启用高级实体抽取
enable_relation_extraction = true  # 启用关系抽取
