[system]
oxigraph_endpoint = "http://localhost:7878"  # Oxigraph HTTP端点
oxigraph_store_path = "oxigraph_data"       # Oxigraph数据存储路径
default_language = "zh"

# Ownthink API配置
[api]
ownthink_base_url = "https://api.ownthink.com/kg"
ownthink_timeout_seconds = 10
enable_entity_disambiguation = true  # 是否启用实体歧义解析
max_ambiguous_entities = 5          # 显示的最大歧义实体数量
auto_select_best_entity = true       # 是否自动选择权重最高的实体

[nlp]
import_keywords = ["录入", "添加", "新增", "记录", "导入", "导入jsonld文件", "导入jsonld内容", "import jsonld", "import jsonld content"]
enable_nlu = true  # 启用语义理解功能
nlu_confidence_threshold = 0.6  # NLU置信度阈值
enable_local_semantic = true  # 启用本地语义理解
disable_ownthink_api = true   # 禁用 ownthink API
semantic_similarity_threshold = 0.7  # 语义相似度阈值
max_entity_candidates = 10  # 最大实体候选数量
enable_advanced_entity_extraction = true  # 启用高级实体抽取
enable_relation_extraction = true  # 启用关系抽取
context_window_size = 5  # 上下文窗口大小

