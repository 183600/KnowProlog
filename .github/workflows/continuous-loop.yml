name: Continuous Loop

on:
  workflow_dispatch:
  # 每 5 分钟一次「心跳」+ 下面 concurrency 排队，保证「一个 job 结束后立刻触发下一个」：
  # 任何时刻组内最多 1 个 running + 1 个 pending；当前 run 无论以何种方式结束
  # （成功 / 失败 / 被取消 / runner 意外宕机），队列中的下一个 run 都会在几秒内开始。
  # 即使收尾的 self-dispatch 步骤被 GitHub 跳过（runner 宕机时连 if: always()
  # 步骤也不会执行），下一次心跳也能在 ≤5 分钟内补位续跑，链条永不断。
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */5 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache npm (opencode-ai)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Prefetch cargo dependencies
        run: |
          set +e
          timeout 600 cargo fetch 2>&1 | tail -5 || echo "[warn] cargo fetch 超时/失败，首次 gate 时再拉取"

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install opencode
        run: |
          set +e
          npm i -g opencode-ai
          if command -v opencode >/dev/null 2>&1; then
            opencode --version
          else
            echo "[error] opencode 安装失败" >&2
            exit 1
          fi
      - name: Configure opencode permissions
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git push*": "deny"
              }
            },
            "model": "opencode/deepseek-v4.1-flash-free"
          }
          EOF

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup xuen (improve 阶段的灵感来源：只产出想法)
        run: |
          set -e
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/183600/xuen.git /tmp/xuen && break
            rm -rf /tmp/xuen; sleep 10
          done
          [ -d /tmp/xuen ] || { echo "[error] 无法克隆 xuen 仓库"; exit 1; }
          python3 -m pip install --quiet -r /tmp/xuen/requirements.txt
          mkdir -p /tmp/xuen_ws
          cat > /tmp/xuen_agent.sh <<'SHEOF'
          #!/usr/bin/env bash
          prompt="$1"
          # xuen 的 agent 一律走 opencode（不安装额外 harness，不访问 DeepSeek 官方 API）
          model="${XUEN_MODEL:-opencode/deepseek-v4.1-flash-free}"
          variant="${XUEN_VARIANT:-}"
          case "$model" in
            opencode/*) ;;
            *) model="opencode/deepseek-v4.1-flash-free"; variant="" ;;
          esac
          extra=""
          [ -n "$variant" ] && extra="--variant $variant"
          # shellcheck disable=SC2086
          exec opencode run -m "$model" $extra "$prompt"
          SHEOF
          chmod +x /tmp/xuen_agent.sh
          cat > /tmp/xuen/config.yaml <<'EOF'
          agent:
            # 由主循环在启动 xuen 前导出 XUEN_MODEL / XUEN_VARIANT；wrapper 一律用 opencode 调用。
            command: '/tmp/xuen_agent.sh "$prompt"'
            timeout: 600
          extra_notes: |
            你是「灵感与研究」agent：只负责产出想法、方案与下一步计划，不要修改、新增或删除
            项目仓库里的任何文件——真正的代码改动由后续另一个 agent（opencode）负责落实。
            每轮结束时把本轮的想法写进想法区，把可落地的方案（接口、数据结构、伪代码、步骤）
            写进产物区。
            改进方向：让系统像 LLM 一样具备自然语言理解与生成能力（多轮对话、上下文记忆、
            生成式回答），但实现路径完全是符号主义的（知识图谱、规则、逻辑推理、检索与
            组合生成），不引入神经网络与权重训练。
          words:
            count: 100
            batch: 100
            pick: 2
            reuse: true
          loop:
            iterations: 1
          tui: false
          color: false
          workspace: /tmp/xuen_ws
          EOF
          echo "[ok] xuen 就绪（工作区 /tmp/xuen_ws，只负责产出想法；代码由 opencode 写）"

      - name: Run agent loop for ~5 hours (xuen 出想法 → opencode 写代码 → clean)
        timeout-minutes: 180
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          OUT=/tmp/oc_out.log
          # 单次 run 的硬预算：3 小时（step 上限 180 分钟，job 上限 200 分钟，
          # 留 10 分钟给收尾的清理 / 最终提交 / 推送）
          RUN_HOURS=3
          DEADLINE=$(( $(date +%s) + RUN_HOURS*3600 - 600 ))
          # ⭐ 远端同步：后继 run 是在本 run 开始时派发的，workflow_dispatch 在事件创建时
          # 解析 ref → SHA，排队中的 run 其 checkout 可能停在派发时刻的旧 commit。
          # 这里强制对齐远端分支最新提交，保证阶段轮换状态（.github/.loop-phase）
          # 与代码总是最新，也避免 workflow 防篡改守卫把新版本误判为「被篡改」而回滚。
          git fetch origin "$BRANCH" --prune >/dev/null 2>&1 || true
          if git rev-parse --verify -q "origin/${BRANCH}" >/dev/null 2>&1; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${BRANCH}")" ]; then
              echo "[sync] 工作区落后于 origin/${BRANCH}，重置到最新提交"
              git reset --hard "origin/${BRANCH}" >/dev/null 2>&1 || true
            fi
          fi

          # ================= 两阶段提示词（improve -> clean） =================
          # bug / perf 阶段已移除：improve 阶段先由 xuen 产出想法，再由 opencode 写代码。
          XUEN_TASK='改进这个项目'
          PROMPT_IMPROVE='改进这个项目。先通读 README.md、PLAN.md 和现有代码，理解项目目标与当前进度，然后做出实质性的改进：补全缺失的功能、完善核心实现、提升代码质量与可用性，让项目向目标推进。每次改动后运行 cargo check --all-targets 自检，不通过就自己修好，并尽量运行 cargo test 验证行为。每完成一个可验证的改动就立即 git commit（不要 push、不要 amend），避免阶段被超时中断时丢失进度。不要输出或写入“改进了哪些内容”的报告。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含所有语言版本的 README）、tests/ 目录同样绝对不能删除、修改或移动。'
          PROMPT_CLEAN='确保远程仓库里没有实验结果文件、REPORT*.md、临时调试脚本与调试输出等杂物；确保仓库中没有任何关于修复了哪些bug、优化或改进了哪些内容的记录（包括注释）。删除所有其他多余的内容。注意：.github 目录是 CI 配置，必须原样保留，绝对不能删除、修改或移动其中任何文件，它不属于“多余的内容”；LICENSE 是开源许可证文件，同样必须原样保留，也不属于“多余的内容”；README*.md（含所有语言版本的 README）是项目说明文档，同样必须原样保留，不能删除或移动；tests/ 是测试套件，必须原样保留；知识库与语料等仍被项目引用或加载的数据文件（如 *.txt、*.jsonld）不属于“多余的内容”，必须保留。'
          # ================= 新增：docs 阶段提示词（每次循环 1/10 概率执行） =================
          PROMPT_DOCS='优化这个项目的代码和文档。代码方面：只做不改变功能语义的重构（命名、注释、消除重复、结构清晰），保持对外接口与行为完全不变；每次改动后运行 cargo check --all-targets 自检，不通过就自己修好，并尽量运行 cargo test 验证行为。文档方面：改进 README.md 与 PLAN.md 的表述、结构与示例；可以修改内容，但不得删除或移动文件，也不得添加关于修复了哪些bug、优化或改进了哪些内容的记录。不要输出或写入“优化了哪些内容”的报告。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；LICENSE、README*.md（含所有语言版本的 README）、tests/ 目录同样绝对不能删除、修改或移动；知识库与语料等仍被项目引用的数据文件必须原样保留。'


          # 每阶段单次调用的最大时长（秒）
          IDEA_TIMEOUT=$((3*3600))     # 3h
          IMPROVE_TIMEOUT=$((3*3600))  # 3h
          CLEAN_TIMEOUT=$((3*3600))    # 3h
          DOCS_TIMEOUT=$((3*3600))    # 3h（docs 阶段：优化代码与文档，1/10 概率执行）


          # ================= workflow 防删自愈 =================
          # agent 的 clean 阶段可能把 .github 当作“多余内容”删除。
          # 启动时保存触发版本的 workflow 原始副本（触发 commit 必然包含它），
          # 每次提交前校验，一旦被删/被改立即恢复，保证循环链条永不断。
          WF_PATH=".github/workflows/continuous-loop.yml"
          PRISTINE=/tmp/wf_pristine.yml

          fetch_pristine() {
            # 优先：本地 origin/BRANCH 的 workflow 文件（启动时已同步到远端最新，
            # 避免「后继 run 从旧 commit 派发」时把新 workflow 误判为被篡改而回滚）
            if git show "origin/${BRANCH}:${WF_PATH}" > "$PRISTINE" 2>/dev/null && [ -s "$PRISTINE" ]; then
              return 0
            fi
            # 备选：raw 直读触发 commit 的 workflow 文件（公共仓库免鉴权）
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${WF_PATH}" -o "$PRISTINE" 2>/dev/null && [ -s "$PRISTINE" ]; then
              return 0
            fi
            # 备选：仓库工作区副本（私有仓库 raw 不可达时）
            if [ -f "$WF_PATH" ]; then
              cp "$WF_PATH" "$PRISTINE"
              return 0
            fi
            return 1
          }

          ensure_workflow() {
            [ -s "$PRISTINE" ] || return 0
            if [ ! -f "$WF_PATH" ] || ! cmp -s "$WF_PATH" "$PRISTINE"; then
              mkdir -p "$(dirname "$WF_PATH")"
              cp "$PRISTINE" "$WF_PATH"
              echo "[guard] 检测到 workflow 文件被删除/篡改，已自动恢复"
            fi
          }

          if fetch_pristine && grep -q "Continuous Loop" "$PRISTINE"; then
            echo "[guard] workflow 原始副本就绪（$(wc -l < "$PRISTINE") 行）"
          else
            echo "[warn] 无法获取 workflow 原始副本，自愈保护不可用"
          fi
          ensure_workflow

          # ================= LICENSE 防删自愈 =================
          # agent 的 clean 阶段可能把 LICENSE 当作“多余内容”删除或篡改。
          # 启动时保存触发 commit 的 LICENSE 原始副本，
          # 每次提交前校验，一旦被删/被改立即恢复，保证 LICENSE 永不丢失。
          LICENSE_PATH="LICENSE"
          LICENSE_PRISTINE=/tmp/license_pristine

          fetch_license_pristine() {
            # 优先：raw 直读触发 commit 的 LICENSE（公共仓库免鉴权）
            if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/LICENSE" -o "$LICENSE_PRISTINE" 2>/dev/null && [ -s "$LICENSE_PRISTINE" ]; then
              return 0
            fi
            # 备选：仓库工作区副本（私有仓库 raw 不可达时）
            if [ -f "$LICENSE_PATH" ]; then
              cp "$LICENSE_PATH" "$LICENSE_PRISTINE"
              return 0
            fi
            return 1
          }

          ensure_license() {
            [ -s "$LICENSE_PRISTINE" ] || return 0
            if [ ! -f "$LICENSE_PATH" ] || ! cmp -s "$LICENSE_PATH" "$LICENSE_PRISTINE"; then
              cp "$LICENSE_PRISTINE" "$LICENSE_PATH"
              echo "[guard] 检测到 LICENSE 被删除/篡改，已自动恢复"
            fi
          }

          if fetch_license_pristine; then
            echo "[guard] LICENSE 原始副本就绪（$(wc -c < "$LICENSE_PRISTINE") 字节）"
          else
            echo "[warn] 无法获取 LICENSE 原始副本，LICENSE 自愈保护不可用"
          fi
          ensure_license

          # ================= README.md 防删自愈 =================
          # clean 阶段可能把 README.md 当作“多余内容”删除。
          # 每次提交前校验：一旦被删，立即从 HEAD（其次最近一个包含它的历史版本）恢复；
          # 只防删除，允许正常的内容修改。
          ensure_readme() {
            # 保护所有语言版本的 README（README.md / README_zh.md / README_en.md）。
            # 只防删除；内容修改不受影响。
            for f in README.md README_zh.md README_en.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_readme

          # ================= PLAN.md / 测试文件 防删自愈 =================
          # PLAN.md（如有）是项目规划文档，只防删除，允许正常修改；
          # 测试文件被删除时一律从 HEAD 恢复（同样允许正常修改）。
          ensure_plan() {
            [ -f PLAN.md ] && return 0
            if git show "HEAD:PLAN.md" > /tmp/plan_restore.md 2>/dev/null && [ -s /tmp/plan_restore.md ]; then
              mv /tmp/plan_restore.md PLAN.md
              echo "[guard] 检测到 PLAN.md 被删除，已从 HEAD 恢复"
            fi
          }
          ensure_tests() {
            git ls-files -- 'tests' 2>/dev/null | while read -r f; do
              [ -n "$f" ] || continue
              if [ ! -e "$f" ]; then
                git checkout HEAD -- "$f" 2>/dev/null && echo "[guard] 检测到测试文件 $f 被删除，已从 HEAD 恢复"
              fi
            done
          }
          ensure_plan
          ensure_tests

          # ================= 质量门禁 =================
          # 门禁按仓库语言适配（编译/测试必须通过）；不通过则整段撤销。
          gate_check() {
            echo "=========== GATE CHECK ==========="
            cargo check --all-targets --quiet 2>&1
            local EC=$?
            if [ $EC -eq 0 ]; then
              echo "[gate] PASS"
            else
              echo "[gate] FAIL (exit=$EC) —— 本阶段改动将被撤销"
            fi
            return $EC
          }

          reject_phase() {
            # 阶段内允许 agent 自己 git commit（防超时丢进度），
            # 因此回滚要回到「本阶段开始时的 HEAD」，不能只回到当前 HEAD。
            local base="${PHASE_BASE:-HEAD}"
            echo "[gate] git reset --hard ${base} + git clean -fd —— 撤销本阶段全部改动"
            git reset --hard "$base"
            git clean -fd
            ensure_workflow
            ensure_license
          }

          i=0
          FAIL_COUNT=0
          RATE_COUNT=0
          CURRENT_MODEL=""
          PREVIOUS_MODEL=""

          # ---------- 提交信息附带本轮实际使用的模型（写入 /tmp/last_model_used.txt） ----------
          MODEL_TAG_FILE=/tmp/last_model_used.txt
          record_model() {
            printf '%s' "$1" > "$MODEL_TAG_FILE" 2>/dev/null || true
          }
          model_tag() {
            local m=""
            [ -f "$MODEL_TAG_FILE" ] && m="$(head -c 120 "$MODEL_TAG_FILE" 2>/dev/null)"
            [ -n "$m" ] && printf ' [model: %s]' "$m"
            return 0
          }

          commit_and_push() {
            ensure_workflow
            ensure_license
            ensure_readme
            ensure_plan
            ensure_tests
            git add -A || true
            git commit -m "auto: iteration $1$(model_tag)" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push origin "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            ensure_workflow
            ensure_license
            ensure_readme
            ensure_plan
            ensure_tests
            # 语法快速检查：半成品代码不允许进入历史（超时视为结果未知，保留改动）
            SYNTAX_EC=0
            timeout 1200 cargo check --all-targets --quiet >/dev/null 2>&1 || SYNTAX_EC=$?
            if [ "$SYNTAX_EC" -ne 0 ] && [ "$SYNTAX_EC" -ne 124 ]; then
              echo "[trap] 语法检查未通过，丢弃未提交改动"
              git reset --hard HEAD
              git clean -fd
              exit 0
            fi
            [ "$SYNTAX_EC" -eq 124 ] && echo "[trap] 语法检查超时（结果未知），保留未提交改动"
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit -m "auto: partial work saved on shutdown$(model_tag)" || true
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              git push origin "HEAD:${BRANCH}" || true
              echo "[trap] partial work committed & pushed"
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 选模型：优先 deepseek-v4.1-flash-free，没有则随机 ----------
          # 1) 优先模型在池中、且本阶段内未刚失败/限流时，始终优先选用；
          # 2) 否则保持随机选择，并尽量避免和上次相同。
          # 池为空时先惰性重建（目录 API 瞬时故障的自愈）；
          # 重建后仍为空则返回 1，由调用方计入失败并稍后重试。
          # ---------- 确定模型思考强度：优先 max，无 max 用 high，都不支持则不设置 ----------
          # 从模型官方元数据公布的 variant 列表中选取；都不支持时按默认方式启动
          # （不传 --variant），避免传无效值导致启动失败。
          variant_for() {
            [ "$1" = "${SELECTED_MODEL:-}" ] && printf '%s' "${SELECTED_VARIANT:-}"
            return 0
          }

          # ================= 模型策略：只用 opencode + Zen 免费模型 =================
          # 已移除 DeepSeek Harness 与 DeepSeek 官方 API 接入：
          #   - 不安装、不调用任何额外 harness，一律只用 opencode；
          #   - 不读取 DeepSeek 官方 key，不访问 DeepSeek 官方端点；
          #   - 所有阶段都通过 `opencode run -m <model> [--variant ...] "$prompt"` 调用。
          # 主力：Zen 网关免费 deepseek-v4.1-flash-free（免鉴权，支持 tool call 与 reasoning effort）；
          # 兜底：同为 Zen 网关免费的 big-pickle（Big Pickle）。
          FREE_MODEL="opencode/deepseek-v4.1-flash-free"
          PICKLE_MODEL="opencode/big-pickle"
          CURRENT_PROVIDER=""
          BROKEN_PROVIDERS=""
          SELECTED_MODEL=""
          SELECTED_PROVIDER=""
          SELECTED_VARIANT=""

          mark_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) ;; *) BROKEN_PROVIDERS="$BROKEN_PROVIDERS${BROKEN_PROVIDERS:+,}$1" ;; esac
          }
          is_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          # ---------- 一次性模型探测（每个 run 只做一次） ----------
          # run 开始时探测一次，选定 SELECTED_MODEL；之后所有阶段直接
          #   opencode run -m "$SELECTED_MODEL" "$prompt"
          # 只有收到 429 / 5xx / 连接失败 / 非零退出时，才重新探测并跳过已判定失效的候选。
          # 注意：只看 /models 目录不够——必须真跑一次冒烟调用，否则会选中
          # “连得上但永远跑不完”的端点。
          smoke_test() {
            local m="$1" extra=""
            case "$m" in "$FREE_MODEL") [ -n "$VARIANT" ] && extra="--variant $VARIANT" ;; esac
            # shellcheck disable=SC2086
            timeout --kill-after=30 120 opencode run -m "$m" $extra "只回复两个字：OK" > /tmp/smoke_test.log 2>&1
          }

          detect_provider() {
            local pass cand model
            for pass in 1 2; do
              for cand in free pickle; do
                is_broken "$cand" && continue
                case "$cand" in
                  free)   model="$FREE_MODEL" ;;
                  pickle) model="$PICKLE_MODEL" ;;
                esac
                if smoke_test "$model"; then
                  SELECTED_MODEL="$model"
                  SELECTED_PROVIDER="$cand"
                  # 只有免费 deepseek 支持 reasoning effort 档位
                  SELECTED_VARIANT=""
                  [ "$cand" = "free" ] && SELECTED_VARIANT="${VARIANT:-}"
                  CURRENT_MODEL="$SELECTED_MODEL"
                  CURRENT_PROVIDER="$SELECTED_PROVIDER"
                  export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT CURRENT_MODEL CURRENT_PROVIDER
                  echo "[provider] 选定 $model（$cand）${SELECTED_VARIANT:+ variant=$SELECTED_VARIANT}，本次 run 内固定使用，不再逐阶段探测"
                  return 0
                fi
                echo "[warn] $model 冒烟测试失败/超时，换下一个候选"
                mark_broken "$cand"
              done
              # 第一轮全部失效：清空失效标记再试一轮（可能是瞬时故障）
              [ "$pass" -eq 1 ] && BROKEN_PROVIDERS=""
            done
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            SELECTED_VARIANT=""
            CURRENT_MODEL=""
            CURRENT_PROVIDER=""
            export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT CURRENT_MODEL CURRENT_PROVIDER
            return 1
          }

          # 兼容两类调用点：旧代码叫 detect_provider，新代码叫 select_harness_model。
          select_harness_model() {
            detect_provider
          }
          oc_mark_broken() {
            mark_broken "$1"
          }

          # ---------- 思考强度（仅免费 deepseek 路径）：有 max 选 max，没有 max 选 high，否则不设置 ----------
          # 先刷新 opencode 的模型目录缓存（models.dev），再解析该模型支持的
          # reasoning effort 档位。检测失败时兜底 max（无效 variant 会被
          # opencode 静默忽略，不会导致调用失败）。
          opencode models opencode --refresh >/dev/null 2>&1 || true
          cat > /tmp/detect_variant.py <<'PYEOF'
          import json, os, sys
          try:
              p = os.path.expanduser('~/.cache/opencode/models.json')
              with open(p) as f:
                  d = json.load(f)
              m = d.get('opencode', {}).get('models', {}).get('deepseek-v4.1-flash-free')
              if m is None:
                  print('UNKNOWN')
                  sys.exit()
              values = []
              for o in (m.get('reasoning_options') or []):
                  values.extend(o.get('values') or [])
              for cand in ('max', 'high'):
                  if cand in values:
                      print(cand)
                      sys.exit()
              print('NONE')
          except Exception:
              print('UNKNOWN')
          PYEOF
          VRESULT=$(python3 /tmp/detect_variant.py 2>/dev/null)
          case "$VRESULT" in
            max|high) VARIANT="$VRESULT" ;;
            NONE)     VARIANT="" ;;
            *)        VARIANT="max" ;;
          esac
          echo "[info] 免费池模型=$FREE_MODEL | 思考强度=${VARIANT:-<不设置>} (detect=$VRESULT)"
          # run 开始时探测一次；失败也不阻塞，run_phase 需要时会再试
          if detect_provider; then :; else echo "[warn] 启动时未选出可用模型，第一个阶段会再探测一次"; fi
          # ---------- 单阶段执行（带重试 + 随机换模型） ----------
          # 参数: phase_name  prompt  timeout_seconds
          # 返回: 0 成功 / 124|137|143 超时被杀 / 1 放弃
          # ================= 前置测试门（pre-opencode test gate） =================
          # 需求：每次 opencode 调用（testfix 测试修复类除外）之前，先跑一遍本仓库测试。
          # 测试定义与 maybe_run_tests 的 /tmp/tg_run.sh 完全一致（退出码语义相同）：
          #   42=无可识别测试 / 43=测试依赖环境不可用 / 124|137|143=测试超时 → 视为无法判定失败，放行。
          # 明确失败 → 提交并推送当前状态（保存进度）→ 提前结束本 job（exit 86）：
          #   后继 run 已由开头的 “Queue next run” 派发进 concurrency 队列，
          #   并有收尾 next-run job 与 */15|*/30 心跳兜底，本 job 一结束下一个几秒内自动开始。
          pre_phase_test() {
            local phase="$1"
            cat > /tmp/pretest_run.sh <<'PTGEOF'
            set +e
            [ -f Cargo.toml ] || exit 42
            command -v cargo >/dev/null 2>&1 || exit 43
            cargo test --quiet
            exit $?
          PTGEOF
            local LOG=/tmp/pretest_gate.log
            echo "=========== PRE-OPENCODE TEST GATE (phase=$phase) ==========="
            local EC=0
            timeout --kill-after=60 1500 bash /tmp/pretest_run.sh > "$LOG" 2>&1 || EC=$?
            tail -25 "$LOG" 2>/dev/null || true
            if [ "$EC" -eq 0 ]; then
              echo "[pre-test] phase=$phase: 测试通过"
              return 0
            fi
            case "$EC" in
              42)  echo "[pre-test] phase=$phase: 本仓库无可识别测试(42)，放行"; return 0 ;;
              43)  echo "[pre-test] phase=$phase: 测试依赖环境不可用(43)，放行"; return 0 ;;
              124|137|143) echo "[pre-test] phase=$phase: 测试超时/中断($EC)，结果不确定，放行"; return 0 ;;
            esac
            echo "[pre-test] phase=$phase: 测试失败(exit=$EC) → 推送当前状态并提前结束本 job"
            git add -A
            git commit -m "auto: pre-opencode test gate failed (phase=$phase, exit=$EC)" \
              || echo "[pre-test] 没有新内容可提交"
            local BRANCH_PT="${GITHUB_REF_NAME:-master}"
            git pull --rebase origin "$BRANCH_PT" 2>/dev/null || git rebase --abort 2>/dev/null || true
            git push origin "HEAD:$BRANCH_PT" \
              || echo "[pre-test] [warn] push 失败，收尾步骤(Final commit and push)会重试"
            return 1
          }

          run_phase() {
            local phase="$1" prompt="$2" budget="$3"
            # ⭐ 前置测试门：除 testfix（测试修复类）外，任何阶段调用 opencode 前必须先过一次测试；
            # 失败即推送当前状态并以 exit 86 提前结束本 job（后继 run 已在队列中，数秒内自动接续）。
            case "$phase" in
              testfix) : ;;
              *) pre_phase_test "$phase" || exit 86 ;;
            esac
            local attempt=0
            # 整个阶段（含所有重试）共用的硬上限
            local phase_end=$(( $(date +%s) + budget ))
            FAIL_COUNT=0
            RATE_COUNT=0
            # 每个阶段开始时恢复优先模型（每阶段总是优先尝试 deepseek-v4.1-flash-free）

            # ⭐ 单次调用约束：本阶段只发起一次 opencode 调用，失败/限流不在本 job 内重试；
            # 由后继 job 对同一阶段再次发起（阶段轮换状态不推进），连续 3 个 job 失败则放弃该阶段。
            local NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "[info] phase=$phase 全局时间已用尽，跳过"
              return 1
            fi
            local REMAIN=$(( DEADLINE - NOW ))
            local budget_now=$(( phase_end - NOW ))
            [ "$budget_now" -gt "$REMAIN" ] && budget_now="$REMAIN"
            if [ "$budget_now" -le 60 ]; then
              echo "[info] phase=$phase 剩余时间不足，跳过"
              return 1
            fi

            # 模型只在 run 开始时挑一次；没有就现选一次（冒烟测试属于测试，不计入阶段调用）
            if [ -z "$CURRENT_MODEL" ] && ! select_harness_model; then
              echo "[warn] phase=$phase 没有可用模型（opencode Zen 免费池不可达），本 job 结束，后继 job 重试该阶段"
              return 1
            fi

            # 思考强度：由探测阶段根据模型元数据选定（max / high / 不设置）
            local EFFORT="" VARFLAG=()
            EFFORT="$(variant_for "$CURRENT_MODEL")"
            if [ -n "$EFFORT" ]; then
              VARFLAG=(--variant "$EFFORT")
              echo "[info] model=$CURRENT_MODEL 思考强度=$EFFORT"
            else
              echo "[info] model=$CURRENT_MODEL 按默认档位启动"
            fi
            echo "=========== run #${GITHUB_RUN_NUMBER:-?} | phase=$phase | provider=$CURRENT_PROVIDER | model=$CURRENT_MODEL effort=${EFFORT:-none} ==========="

            record_model "$CURRENT_MODEL"
            local oc_extra=""
            [ -n "$SELECTED_VARIANT" ] && oc_extra="--variant $SELECTED_VARIANT"
            # shellcheck disable=SC2086
            timeout --kill-after=180 "$budget_now" opencode run -m "$CURRENT_MODEL" $oc_extra "$prompt" 2>&1 | tee "$OUT"
            local EC=$?

            # 成功 / 超时被杀：预算耗尽属正常结束，改动照常提交，阶段正常完成
            if [ $EC -eq 0 ] || [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
              return $EC
            fi

            # 调用失败（非超时）：不在本 job 内重试；后继 job 会对同一阶段再发起一次调用
            if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429"; then
              echo "[warn] phase=$phase 命中限流(429)，交由后继 job 重试"
            elif tail -40 "$OUT" | grep -qiE "401|unauthorized|invalid.{0,4}api.?key|missing.{0,4}api.?key"; then
              echo "[hint] 疑似鉴权问题：匿名限额可能耗尽。可在仓库 secrets 配置 OPENCODE_API_KEY 提升限额后重试"
            else
              echo "[warn] phase=$phase 调用失败 (exit=$EC, model=$CURRENT_MODEL)，交由后继 job 重试"
            fi
            return $EC

            return 1
          }

          # ---------- xuen 灵感阶段（只产出想法，不写代码） ----------
          # xuen 内部自带「每轮超时 + 连续 3 次失败中止」；外层 timeout 只做该阶段
          # 的总预算兜底。xuen 退出后清理可能残留的 xuen agent 孤儿进程，避免与
          # 后面的写代码阶段并发。模型选择与 opencode 直连路径共用 pick_provider。
          run_xuen_ideas() {
            local budget="$1" task="$2"
            local attempt=0
            if [ ! -d /tmp/xuen ] || [ ! -f /tmp/xuen/config.yaml ]; then
              echo "[warn] xuen 未就绪，跳过灵感阶段（直接用基础 prompt 跑 improve）"
              return 1
            fi
            # ⭐ 单次调用约束：灵感阶段只发起一次 opencode 调用（xuen 配置 iterations:1 +
            # --no-rounds 跳过评审），失败/限流不在本 job 内重试，由后继 job 重试同一阶段。
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "[info] phase=ideas(xuen) 全局时间已用尽，跳过"
              return 1
            fi
            if [ -z "$CURRENT_MODEL" ] && ! select_harness_model; then
              echo "[warn] phase=ideas(xuen) 没有可用模型（opencode Zen 免费池不可达），本 job 结束，后继 job 重试该阶段"
              return 1
            fi
            local VARFLAGS=""
            local EFFORT
            EFFORT="$(variant_for "$CURRENT_MODEL")"
            [ -n "$EFFORT" ] && VARFLAGS="--variant $EFFORT"
            export XUEN_MODEL="$CURRENT_MODEL"
            export XUEN_VARIANT="$SELECTED_VARIANT"
            export XUEN_MODEL_FLAGS="$VARFLAGS"
            record_model "$CURRENT_MODEL"
            echo "=========== run #${GITHUB_RUN_NUMBER:-?} | phase=ideas(xuen) | provider=$CURRENT_PROVIDER | model=$CURRENT_MODEL effort=${XUEN_MODEL_FLAGS:-none} ==========="
            # --no-rounds：只取「想法区」，跳过轮次守卫（候选快照 + AI 评审都会再调一次 agent，
            # 纯灵感阶段没必要，省下的时间留给后面的写代码阶段）
            timeout --kill-after=120 "$budget" python3 /tmp/xuen/main.py "$task" --no-tui --no-rounds -c /tmp/xuen/config.yaml 2>&1 | tee "$OUT"
            local EC=${PIPESTATUS[0]}
            # 清理可能残留的 xuen agent 孤儿进程
            pkill -f "/tmp/xuen_agent.sh" 2>/dev/null || true
            sleep 2
            pkill -9 -f "/tmp/xuen_agent.sh" 2>/dev/null || true
            if [ $EC -eq 0 ] || [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
              echo "[info] phase=ideas(xuen) 完成 (exit=$EC)"
              return 0
            fi
            echo "[warn] phase=ideas(xuen) 失败 (exit=$EC)，仍沿用已产出的想法（若有）"
            return 0
            return 1
          }

          # ---------- 读取 xuen 想法区（跨 job：优先 .github/.loop-ideas，其次 /tmp 工作区副本） ----------
          collect_ideas() {
            python3 - <<'PYIDEA' 2>/dev/null || true
          import pathlib, re
          for p in ('.github/.loop-ideas', '/tmp/xuen_ws/research.md'):
              try:
                  text = pathlib.Path(p).read_text(encoding='utf-8', errors='replace')
              except Exception:
                  continue
              m = re.search(r'<!--\s*IDEA:START\s*-->(.*?)<!--\s*IDEA:END\s*-->', text, re.S)
              body = (m.group(1) if m else text).strip()
              if body and body != '（暂无）':
                  print(body[:6000])
                  break
          PYIDEA
          }

          # ---------- 把 xuen 想法区落盘到 .github/.loop-ideas，供后继 improve job 读取 ----------
          # （灵感阶段与写代码阶段已拆分为两个 job：想法必须经仓库状态文件传递）
          save_ideas_to_state() {
            python3 - <<'PYSAVE' 2>/dev/null || true
          import pathlib, re
          try:
              text = pathlib.Path('/tmp/xuen_ws/research.md').read_text(encoding='utf-8', errors='replace')
          except Exception:
              raise SystemExit(0)
          m = re.search(r'<!--\s*IDEA:START\s*-->(.*?)<!--\s*IDEA:END\s*-->', text, re.S)
          body = (m.group(1) if m else text).strip()
          if not body or body == '（暂无）':
              raise SystemExit(0)
          d = pathlib.Path('.github')
          d.mkdir(exist_ok=True)
          d.joinpath('.loop-ideas').write_text(body[:6000], encoding='utf-8')
          PYSAVE
            git add -f .github/.loop-ideas 2>/dev/null || true
          }

          # ================= 新增：概率测试门（20% 执行 / 80% 跳过）=================
          # 在「修复 bug 的 opencode 调用」提交之后触发（调用点见主循环 phase=bug 守卫）。
          # 掷骰子 1..100：≤20 才执行本步（80% 直接跳过）——跑一遍本仓库的测试；
          # 跑不通 → 调用 opencode 修复 → 修复结果按本仓库既有提交路径落到 main/master。
          maybe_run_tests() {
            local iter="$1"
            # 不再按 20% 抽样：每次提交后都跑（剩余时间/依赖/超时保护仍然生效）
            echo "[test-gate] iter #$iter 执行 cargo test"
            local TG_REMAIN=$(( DEADLINE - $(date +%s) ))
            if [ "$TG_REMAIN" -lt 1200 ]; then
              echo "[test-gate] 剩余时间不足 20 分钟，放弃本次测试"
              return 0
            fi
            cat > /tmp/tg_run.sh <<'TGEOF'
            set +e
            [ -f Cargo.toml ] || exit 42
            command -v cargo >/dev/null 2>&1 || exit 43
            cargo test --quiet
            exit $?
          TGEOF
            local TG_LOG=/tmp/test_gate.log
            echo "=========== TEST GATE (iter #$iter) ==========="
            timeout --kill-after=60 1500 bash /tmp/tg_run.sh > "$TG_LOG" 2>&1
            local TG_EC=$?
            tail -25 "$TG_LOG" 2>/dev/null || true
            if [ "$TG_EC" -eq 0 ]; then
              echo "[test-gate] 测试通过，无需修复"
              return 0
            fi
            if [ "$TG_EC" -eq 42 ]; then
              echo "[test-gate] 本仓库没有可识别的测试，跳过"
              return 0
            fi
            if [ "$TG_EC" -eq 43 ]; then
              echo "[test-gate] 测试依赖环境不可用（安装失败），跳过修复"
              return 0
            fi
            if [ "$TG_EC" -eq 124 ] || [ "$TG_EC" -eq 137 ] || [ "$TG_EC" -eq 143 ]; then
              echo "[test-gate] 测试超时/被中断 (exit=$TG_EC)，结果不确定，本轮不修复"
              return 0
            fi
            echo "[test-gate] 测试未通过 (exit=$TG_EC)，调用 opencode 修复"
            local TG_FIX_BUDGET=$(( DEADLINE - $(date +%s) - 900 ))
            if [ "$TG_FIX_BUDGET" -lt 900 ]; then
              echo "[test-gate] 剩余时间不足以安排修复，仅记录失败"
              return 0
            fi
            if [ "$TG_FIX_BUDGET" -gt 10800 ]; then TG_FIX_BUDGET=10800; fi
            {
              echo '本仓库的测试跑不通，请修复。复现方式：在仓库根目录运行 bash /tmp/tg_run.sh。'
              echo
              echo '失败日志（最后 80 行）：'
              tail -80 "$TG_LOG" 2>/dev/null
              echo
              echo '要求：'
              echo '1. 只修复导致测试失败的问题，不得削弱、跳过或删除测试，不得修改门禁脚本让断言失效；'
              echo '2. 不要借修复之名重写无关代码，保持原有功能语义不变；'
              echo '3. .github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；'
              echo '4. 修复后必须自行运行测试并确认完全通过。'
            } > /tmp/tg_fix_prompt.txt
            PHASE_BASE="$(git rev-parse HEAD)"
            run_phase "testfix" "$(cat /tmp/tg_fix_prompt.txt)" "$TG_FIX_BUDGET" || true


            timeout --kill-after=30 600 bash /tmp/tg_run.sh > /tmp/test_gate_verify.log 2>&1
            local TG_VEC=$?
            if [ "$TG_VEC" -eq 0 ]; then
              echo "[test-gate] 修复后复跑测试：通过"
            else
              echo "[test-gate] 修复后复跑测试仍未通过 (exit=$TG_VEC)"
            fi

            # 修复结果走与各阶段一致的质量门禁 + 提交路径（main/master）
            if gate_check; then
              commit_and_push "$iter-testfix"
            else
              reject_phase
            fi

            return 0
          }

          # ================= 主循环 =================
          # ---- 模型只在 run 开始时探测/挑选一次，之后所有阶段复用 ----
          if select_harness_model; then
            echo "[provider] 选定 $CURRENT_MODEL（$CURRENT_PROVIDER），本次 run 内固定使用"
          else
            echo "[warn] 启动时没有可用模型，第一个阶段会再试一次"
          fi

          # ================= 单阶段执行（每个 job 只做一次 opencode 调用） =================
          # 原 improve 阶段一次包含「xuen 出想法 + opencode 写代码」两次 opencode 调用，
          # 现拆分为两个 job 阶段：ideas（xuen 灵感，单次调用）与 improve（写代码，单次调用）。
          # 想法经 .github/.loop-ideas 传递；轮换状态存于 .github/.loop-phase（phase:failcount）。
          # 需要进行下一次调用时，由已排队的后继 job 接续（concurrency 队列 + 收尾 next-run job
          # + */15 心跳三重兜底，链条永不断）。测试类调用不受单次限制（前置测试门 / 冒烟测试）。
          # 轮换：ideas → improve →（1/10 概率插入 docs）→ ideas 循环。
          STATE_FILE=".github/.loop-phase"
          read_loop_state() {
            if [ -f "$STATE_FILE" ]; then
              local line p n
              line="$(head -1 "$STATE_FILE" 2>/dev/null | tr -d '[:space:]')"
              p="${line%%:*}"; n="${line##*:}"
              case "$p" in
                ideas|improve|docs) ;;
                *) p="ideas" ;;
              esac
              case "$n" in ''|*[!0-9]*) n="0" ;; esac
              printf '%s:%s' "$p" "$n"
            else
              printf 'ideas:0'
            fi
          }
          write_loop_state() {
            mkdir -p .github
            printf '%s:%s\n' "$1" "$2" > "$STATE_FILE"
            git add -f "$STATE_FILE" 2>/dev/null || true
          }
          next_phase_of() {
            case "$1" in
              ideas)   printf '%s' "improve" ;;
              improve)
                if [ $(( RANDOM % 10 )) -eq 0 ]; then printf 'docs'; else printf 'ideas'; fi ;;
              docs)  printf '%s' "ideas" ;;
            esac
          }
          STATE_LINE="$(read_loop_state)"
          PHASE="${STATE_LINE%%:*}"
          STATE_FAIL="${STATE_LINE##*:}"
          i="run${GITHUB_RUN_NUMBER:-0}"

          AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
          echo "--- $i | phase=$PHASE | fail=$STATE_FAIL | free disk: ${AVAIL_MB}MB ---"
          free -h | head -2
          if [ "$AVAIL_MB" -lt 2048 ]; then
            echo "[error] 磁盘剩余不足 2GB，本 job 提前结束，交给收尾步骤清理"
            exit 0
          fi

          # ----- 本 job 唯一要执行的阶段 -----
          case "$PHASE" in
            ideas)
              # ---- 灵感阶段：xuen 只产出想法（单次 opencode 调用），不修改仓库代码 ----
              pre_phase_test "ideas" || exit 86
              IT="$IDEA_TIMEOUT"
              ITR=$(( DEADLINE - $(date +%s) ))
              if [ "$ITR" -le 60 ]; then
                echo "[info] 剩余时间不足，本 job 不再发起调用"
                exit 0
              fi
              [ "$IT" -gt "$ITR" ] && IT="$ITR"
              run_xuen_ideas "$IT" "$XUEN_TASK"
              IDEAS_RC=$?
              save_ideas_to_state
              # ---- 灵感阶段轮换推进 ----
              case "$IDEAS_RC" in
                0)
                  write_loop_state "improve" 0
                  echo "[state] ideas 阶段结束 (rc=0) → 后继 job 将执行 improve"
                  ;;
                *)
                  STATE_FAIL=$(( STATE_FAIL + 1 ))
                  if [ "$STATE_FAIL" -ge 3 ]; then
                    write_loop_state "improve" 0
                    echo "[state] ideas 连续 ${STATE_FAIL} 个 job 失败，放弃该阶段 → 后继 job 将执行 improve（基础 prompt）"
                  else
                    write_loop_state "ideas" "$STATE_FAIL"
                    echo "[state] ideas 阶段失败 (rc=$IDEAS_RC) → 后继 job 重试同一阶段 (${STATE_FAIL}/3)"
                  fi
                  ;;
              esac
              exit 0
              ;;
            improve)
              # ---- 写代码阶段：读取上个 ideas job 落盘的想法，单次 opencode 调用 ----
              P="$PROMPT_IMPROVE"
              IDEAS="$(collect_ideas)"
              if [ -n "$IDEAS" ]; then
                P="$PROMPT_IMPROVE"$'\n\n''【xuen 本轮产出的想法（参考，可采纳也可否定；仍以项目目标为准）】'$'\n'"$IDEAS"
                echo "[info] 已注入 xuen 想法 $(printf '%s' "$IDEAS" | wc -c) 字节"
              else
                echo "[info] 未取到 xuen 想法，使用基础 prompt"
              fi
              T="$IMPROVE_TIMEOUT"
              ;;
            docs)
              P="$PROMPT_DOCS"
              T="$DOCS_TIMEOUT"
              ;;
          esac

          # 收窄到剩余时间
          REMAIN=$(( DEADLINE - $(date +%s) ))
          if [ "$REMAIN" -le 0 ]; then
            echo "[info] 全局时间已到，本 job 不再发起调用"
            exit 0
          fi
          if [ "$T" -gt "$REMAIN" ]; then T="$REMAIN"; fi

          echo ">>> $i | phase=$PHASE | budget=${T}s"
          PHASE_BASE="$(git rev-parse HEAD)"
          run_phase "$PHASE" "$P" "$T"
          PHASE_RC=$?

          # ---- 质量门禁：通过才提交；不通过则整段撤销 ----
          if gate_check; then
            commit_and_push "$i-$PHASE"
          else
            reject_phase
          fi

          # ---- 阶段轮换推进：成功/超时 → 下一阶段；失败 → 后继 job 重试同一阶段（连续 3 个 job 后放弃） ----
          case "$PHASE_RC" in
            0|124|137|143)
              NEXT="$(next_phase_of "$PHASE")"
              write_loop_state "$NEXT" 0
              echo "[state] phase=$PHASE 结束 (rc=$PHASE_RC) → 后继 job 将执行 $NEXT"
              ;;
            *)
              STATE_FAIL=$(( STATE_FAIL + 1 ))
              if [ "$STATE_FAIL" -ge 3 ]; then
                NEXT="$(next_phase_of "$PHASE")"
                write_loop_state "$NEXT" 0
                echo "[state] phase=$PHASE 连续 ${STATE_FAIL} 个 job 失败，放弃该阶段 → 后继 job 将执行 $NEXT"
              else
                write_loop_state "$PHASE" "$STATE_FAIL"
                echo "[state] phase=$PHASE 调用失败 (rc=$PHASE_RC) → 后继 job 重试同一阶段 (${STATE_FAIL}/3)"
              fi
              ;;
          esac
      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          find . -type f -name 'REPORT*.md'          -not -path './.git/*' -delete
          find . -type f -name 'autodl_budget*.json' -not -path './.git/*' -delete

      - name: Final commit and push
        if: always()
        run: |
          set +e
          # 防删自愈：收尾提交前恢复被删/改的 workflow
          WF=".github/workflows/continuous-loop.yml"
          PRISTINE=/tmp/wf_pristine.yml
          if [ ! -s "$PRISTINE" ]; then
            git show "origin/${GITHUB_REF_NAME:-master}:${WF}" > "$PRISTINE" 2>/dev/null || true
          fi
          if [ ! -s "$PRISTINE" ] && [ -n "${GITHUB_SHA:-}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${WF}" -o "$PRISTINE" 2>/dev/null || true
          fi
          if [ -s "$PRISTINE" ] && { [ ! -f "$WF" ] || ! cmp -s "$WF" "$PRISTINE"; }; then
            mkdir -p .github/workflows
            cp "$PRISTINE" "$WF"
            echo "[guard] 收尾阶段发现 workflow 被删/改，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删/改的 LICENSE
          LIC="LICENSE"
          LIC_PRISTINE=/tmp/license_pristine
          if [ ! -s "$LIC_PRISTINE" ] && [ -n "${GITHUB_SHA:-}" ]; then
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/LICENSE" -o "$LIC_PRISTINE" 2>/dev/null || true
          fi
          if [ -s "$LIC_PRISTINE" ] && { [ ! -f "$LIC" ] || ! cmp -s "$LIC" "$LIC_PRISTINE"; }; then
            cp "$LIC_PRISTINE" "$LIC"
            echo "[guard] 收尾阶段发现 LICENSE 被删/改，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的 README.md
          if [ ! -f "README.md" ]; then
            if git show HEAD:README.md > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            else
              README_SHA=$(git log --format=%H --diff-filter=AM -- README.md 2>/dev/null | head -1)
              if [ -n "$README_SHA" ] && git show "${README_SHA}:README.md" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md README.md
              fi
            fi
            [ -f README.md ] && echo "[guard] 收尾阶段发现 README.md 被删，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的多语言 README 与 PLAN.md
          for f in README_zh.md README_en.md PLAN.md; do
            if [ ! -f "$f" ] && git show "HEAD:$f" > "/tmp/final_restore_$f" 2>/dev/null && [ -s "/tmp/final_restore_$f" ]; then
              mv "/tmp/final_restore_$f" "$f"
              echo "[guard] 收尾阶段发现 $f 被删，已恢复"
            fi
          done
          # 防删自愈：收尾提交前恢复被删的测试文件
          git ls-files -- 'tests' 2>/dev/null | while read -r f; do
            [ -n "$f" ] || continue
            if [ ! -e "$f" ]; then
              git checkout HEAD -- "$f" 2>/dev/null && echo "[guard] 收尾阶段发现测试文件 $f 被删，已恢复"
            fi
          done

          # 质量门禁：收尾状态必须可运行，否则回退到最后一次已验证状态
          gate_final() {
            cargo check --all-targets --quiet 2>&1
          }
          if ! gate_final; then
            echo "[gate] 收尾状态未通过，回退到 HEAD"
            git reset --hard HEAD
            git clean -fd
          fi
          git add -A
          LAST_MODEL="$(head -c 120 /tmp/last_model_used.txt 2>/dev/null || true)"
          git commit -m "auto: end of 5h run, cleanup${LAST_MODEL:+ [model: $LAST_MODEL]}" || echo "nothing to commit"
          BRANCH="${GITHUB_REF_NAME:-master}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Push to Gitee
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set +e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME:-master}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${BRANCH}" --force || echo "[warn] push to Gitee failed"
  # ===== loop hand-off (added) =====

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：工作 job 无论成功、失败、超时被取消，这个 job 都会紧接着启动（已实测验证）。
  # 这里无条件派发一个新的后继 run：它在组内排队，本 run 退出的一瞬间就被调度。
  # 万一这个 job 连启动都没机会（整个 run 被强杀），*/5 心跳会兜底。
  next-run:
    needs: [run-opencode]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */5 心跳会补位"
          exit 0
