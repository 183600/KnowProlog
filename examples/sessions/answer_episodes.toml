name = "回答图式与回合欠账"
description = "直接回答 → 续聊 → 追问依据 → 换主体 → 回顾 → 缺口；断言回答图式与回合欠账，而不是钉死措辞"

[[entities]]
name = "姚明"
type = "Person"
attributes = { "身高" = "226", "国籍" = "中国" }

[[entities]]
name = "叶莉"
type = "Person"
attributes = { "身高" = "190", "国籍" = "中国" }

[[turns]]
input = "姚明的身高是多少"
expect = { answered = true, intent = "ask_attribute", answer_schema = "attribute", episode_closed = true, answer_contains = ["226"] }

[[turns]]
input = "还有呢"
expect = { answered = true, intent = "continue", answer_schema = "attribute", missing_obligations_contains = ["evidence"], episode_closed = false }

[[turns]]
input = "你怎么知道的？"
expect = { answered = true, intent = "meta_why", answer_schema = "attribute", missing_obligations_contains = ["evidence"], episode_closed = false }

[[turns]]
input = "叶莉的身高是多少"
expect = { answered = true, intent = "ask_attribute", answer_schema = "attribute", episode_closed = true, answer_contains = ["190"] }

[[turns]]
input = "我们聊过什么？"
expect = { answered = true, intent = "meta_recap", answer_schema = "recap", episode_closed = true, answer_contains = ["姚明"] }

[[turns]]
input = "张三的身高是多少"
expect = { answered = false, reply_kind = "unhandled", answer_schema = "", gaps_contains = ["unhandled"] }

[[turns]]
input = "姚明的体重是多少"
expect = { answered = true, intent = "ask_attribute", answer_schema = "attribute", missing_obligations_contains = ["answer", "evidence"], episode_closed = false, gaps_contains = ["knowledge_gap"] }
