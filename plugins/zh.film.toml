id = "zh.film"
version = "0.1.0"
api = 1
name = "电影知识包"
description = "作品 / 导演 / 演员的声明式问法与检索配方。"
default_mode = "off"

[[contributions]]
kind = "lexicon"
id = "film.lexicon"
description = "电影领域词面归一。"
entries = [
  { surface = "影片", canonical = "电影" },
  { surface = "片子", canonical = "电影" },
  { surface = "动画片", canonical = "动画电影" },
]

[[contributions]]
kind = "ontology"
id = "film.ontology"
description = "电影领域本体：类型层级 + 谓词别名/互逆/定义域/值域（启动时并入统一推理器）。"
predicates = [
  { name = "导演", aliases = ["director"], inverse = "执导", domain = ["电影"], range = ["人物"] },
  { name = "主演", aliases = ["演员"], domain = ["电影"], range = ["人物"] },
]
types = [
  { name = "影视作品" },
  { name = "电影", aliases = ["影片"], subclass_of = ["影视作品"] },
  { name = "动画电影", subclass_of = ["电影"] },
  { name = "人物" },
]

[[contributions]]
kind = "recipe"
id = "film.directed_by"
description = "作品 → 导演（正向；答案类型约束为人物）"
patterns = [
  "{entity}是谁导演的",
  "{entity}由谁导演",
  "{entity}由谁执导",
  "{entity}的导演是谁",
  "{entity}是谁拍的",
  "{entity}是谁拍摄的",
  "{entity}是谁执导的",
  "{entity}由谁拍摄",
  "{entity}由谁拍摄的",
  "谁导演了{entity}",
  "谁导演过{entity}",
  "谁执导了{entity}",
  "谁执导过{entity}",
  "谁拍摄了{entity}",
  "谁拍摄过{entity}",
  "谁拍了{entity}",
  "谁拍过{entity}",
  "谁导演的{entity}",
  "谁执导的{entity}",
  "谁拍摄的{entity}",
  "谁拍的{entity}",
  "{entity}的导演是谁，依据是什么",
  "{entity}是谁导演的，为什么",
]
question = "{entity}的导演是什么"
attribute = "导演"
answer_types = ["人物"]
template = "film.directed_by.template"

[[contributions]]
kind = "recipe"
id = "film.works_by_director"
description = "导演 → 作品（逆向检索；答案类型约束为电影）"
patterns = [
  "{entity}导演过哪些电影",
  "{entity}导演过哪些作品",
  "{entity}导演的电影有哪些",
  "{entity}执导过哪些电影",
  "{entity}执导过哪些作品",
  "{entity}导演过哪些动画电影",
  "{entity}执导过哪些动画电影",
  "{entity}导演过什么电影",
  "{entity}执导过什么电影",
  "{entity}导演过什么动画电影",
  "{entity}拍过哪些电影",
  "{entity}拍过哪些作品",
  "{entity}拍过哪些动画电影",
  "{entity}拍过什么电影",
  "{entity}拍过什么动画电影",
  "{entity}拍摄过哪些电影",
  "{entity}拍摄过哪些作品",
  "{entity}还导演过哪些电影",
  "{entity}还导演过什么",
  "{entity}还执导过什么",
  "{entity}还拍过什么",
  "{entity}都导演过哪些电影",
  "{entity}都拍过哪些电影",
  "哪些电影是{entity}导演的",
  "哪些动画电影是{entity}导演的",
  "那{entity}还导演过什么",
  "那{entity}还拍过什么",
]
question = "{entity}导演过哪些作品"
attribute = "导演"
direction = "inverse"
answer_types = ["电影"]
template = "film.works.template"

[[contributions]]
kind = "recipe"
id = "film.cast_of"
description = "作品 → 主演（正向；多值合并）"
patterns = [
  "{entity}的主演是谁",
  "{entity}的主演有谁",
  "{entity}由谁主演",
  "{entity}由谁出演",
  "{entity}是谁主演的",
  "{entity}是谁演的",
  "{entity}由谁演的",
  "谁主演了{entity}",
  "谁出演了{entity}",
  "谁演了{entity}",
  "谁演的{entity}",
  "谁主演的{entity}",
]
question = "{entity}的主演是谁"
attribute = "主演"
answer_types = ["人物"]
template = "film.cast.template"

[[contributions]]
kind = "recipe"
id = "film.works_by_actor"
description = "演员 → 作品（逆向检索；答案类型约束为电影）"
patterns = [
  "{entity}演过哪些电影",
  "{entity}主演过哪些电影",
  "{entity}演过什么电影",
  "{entity}主演过什么电影",
  "{entity}演过哪些动画电影",
  "{entity}演过什么",
  "{entity}主演过什么",
  "{entity}还演过哪些电影",
  "{entity}还演过什么",
  "{entity}都演过哪些电影",
  "哪些电影是{entity}主演的",
  "哪些动画电影是{entity}演的",
  "那{entity}还演过什么",
]
question = "{entity}主演过哪些作品"
attribute = "主演"
direction = "inverse"
answer_types = ["电影"]
template = "film.works.template"

[[contributions]]
kind = "template"
id = "film.directed_by.template"
description = "导演配方模板（所有槽位必须接地，依据来自事实/公理闭包）。"
template = "「{entity}」的导演是{answer}。依据：{evidence}"

[[contributions]]
kind = "template"
id = "film.works.template"
description = "作品配方模板（逆向检索；依据必须接地）。"
template = "「{entity}」参与的作品有{answer}。依据：{evidence}"

[[contributions]]
kind = "template"
id = "film.cast.template"
description = "主演配方模板（多值合并；依据必须接地）。"
template = "「{entity}」的主演是{answer}。依据：{evidence}"

[[eval_cases]]
input = "阿凡达是谁导演的"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"
expect_contains = "导演"

[[eval_cases]]
input = "阿凡达由谁执导"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"

[[eval_cases]]
input = "谁执导了阿凡达"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"

[[eval_cases]]
input = "卡梅隆执导过哪些电影"
expect_rewrite = "卡梅隆导演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "卡梅隆导演过哪些电影"
expect_rewrite = "卡梅隆导演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "那他还导演过什么"
expect_rewrite = "他导演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "阿凡达的主演是谁"
expect_rewrite = "阿凡达的主演是谁"
expect_plugin = "zh.film"

[[eval_cases]]
input = "阿凡达的导演是谁"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"

[[eval_cases]]
input = "阿凡达是谁拍的"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"

[[eval_cases]]
input = "卡梅隆拍过哪些电影"
expect_rewrite = "卡梅隆导演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "宫崎骏导演过哪些动画片"
expect_rewrite = "宫崎骏导演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "这位导演还拍过什么"
expect_rewrite = "这位导演导演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "阿凡达是谁拍摄的？"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"

[[eval_cases]]
input = "请问阿凡达是谁导演的呢？"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"

[[eval_cases]]
input = "谁拍过阿凡达"
expect_rewrite = "阿凡达的导演是什么"
expect_plugin = "zh.film"

[[eval_cases]]
input = "哪些电影是卡梅隆导演的"
expect_rewrite = "卡梅隆导演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "阿凡达的主演有谁"
expect_rewrite = "阿凡达的主演是谁"
expect_plugin = "zh.film"

[[eval_cases]]
input = "萨姆·沃辛顿演过什么电影"
expect_rewrite = "萨姆·沃辛顿主演过哪些作品"
expect_plugin = "zh.film"

[[eval_cases]]
input = "哪些电影是萨姆·沃辛顿主演的"
expect_rewrite = "萨姆·沃辛顿主演过哪些作品"
expect_plugin = "zh.film"

[[contributions]]
kind = "reference"
id = "film.reference"
description = "电影领域指称线索（启动时补入分词/词性词典）。"
quantifiers = ["这位", "那位", "该"]
role_words = ["导演", "演员"]
surnames = ["卡梅隆"]

[[contributions]]
kind = "policy"
id = "film.unknown"
description = "领域问题答不了时的兜底措辞。"
when = ["导演", "演员", "影片"]
reply = "我的电影知识库暂时没有这条记录。你可以说「录入：…」教我，或换个说法再问。"
